# ===========================================================================
# PP-OCRv4 Recognition — Fine-tune Configuration
# ===========================================================================
# Cấu hình huấn luyện (fine-tune) mô hình nhận dạng chữ PP-OCRv4.
# Tối ưu cho Tiếng Việt — có thể điều chỉnh cho ngôn ngữ khác.
#
# Usage:
#   python -m paddle.distributed.launch --gpus '0' \
#       PaddleOCR/tools/train.py -c config_rec_v4.yml
# ===========================================================================

Global:
  # --- Đường dẫn ---
  use_gpu: true
  epoch_num: 200
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/rec_ppocr_v4
  save_epoch_step: 10
  eval_batch_step:
    - 0
    - 500
  cal_metric_during_train: true

  # --- Pretrained model (PP-OCRv4 Vietnamese) ---
  pretrained_model: null
  # Uncomment dòng dưới nếu đã tải model pretrained:
  # pretrained_model: ./pretrained/vi_PP-OCRv4_rec_train/best_accuracy

  checkpoints: null
  save_inference_dir: ./output/inference/rec
  use_visualdl: false
  infer_img: null

  # --- Ký tự dictionary ---
  # File chứa danh sách ký tự nhận dạng.
  # Tạo tự động từ dữ liệu hoặc dùng dict có sẵn của PaddleOCR.
  character_dict_path: null
  # Uncomment nếu dùng dict tiếng Việt:
  # character_dict_path: PaddleOCR/ppocr/utils/dict/vi_dict.txt
  max_text_length: 40
  infer_mode: false
  use_space_char: true

# ===========================================================================
# Optimizer
# ===========================================================================
Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0005
    warmup_epoch: 5
  regularizer:
    name: L2
    factor: 3.0e-5

# ===========================================================================
# Architecture — PP-OCRv4 Recognition (SVTR_LCNet)
# ===========================================================================
Architecture:
  model_type: rec
  algorithm: SVTR_LCNet

  Transform: null

  Backbone:
    name: MobileNetV1Enhance
    scale: 0.5
    last_conv_stride:
      - 1
      - 2
    last_pool_type: avg

  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 64
            depth: 2
            hidden_dims: 120
            use_guide: true
          Head:
            fc_decay: 0.00001
      - SARHead:
          enc_dim: 512
          max_text_length: 40

# ===========================================================================
# Loss
# ===========================================================================
Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss: null
    - SARLoss: null

# ===========================================================================
# Post-processing
# ===========================================================================
PostProcess:
  name: CTCLabelDecode

# ===========================================================================
# Metric
# ===========================================================================
Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: false

# ===========================================================================
# Train Dataset
# ===========================================================================
Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./dataset/train/images
    label_file_list:
      - ./dataset/train/label.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - RecConAug:
          prob: 0.5
          ext_data_num: 2
          image_shape:
            - 48
            - 320
            - 3
          max_text_length: 40
      - RecAug: null
      - MultiLabelEncode: null
      - RecResizeImg:
          image_shape:
            - 3
            - 48
            - 320
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_sar
            - length
            - valid_ratio
  loader:
    shuffle: true
    batch_size_per_card: 64
    drop_last: true
    num_workers: 4

# ===========================================================================
# Eval Dataset
# ===========================================================================
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./dataset/val/images
    label_file_list:
      - ./dataset/val/label.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - MultiLabelEncode: null
      - RecResizeImg:
          image_shape:
            - 3
            - 48
            - 320
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_sar
            - length
            - valid_ratio
  loader:
    shuffle: false
    batch_size_per_card: 128
    drop_last: false
    num_workers: 4
